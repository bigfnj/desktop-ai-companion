name: build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and package x64
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # Full history: the module-publish freshness check below compares commit ordering between
          # modules/<Id>/ and modules-dist/<id>.zip, which a shallow single-commit clone cannot answer.
          fetch-depth: 0

      - name: Set up the .NET 10 SDK
        # Must match global.json exactly: it pins 10.0.302 with rollForward "disable" so the FINAL
        # artifact is reproducible, which means a mismatched runner SDK fails the build outright.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.302'

      - name: Build Release x64 and the portable ZIP
        shell: pwsh
        run: .\build.ps1 -Release -Zip

      - name: Build and run core regression tests
        shell: pwsh
        run: |
          dotnet build .\tests\DesktopAICompanion.CoreTests\DesktopAICompanion.CoreTests.csproj `
            -c Release -p:Platform=x64 --nologo -v:minimal
          & '.\tests\DesktopAICompanion.CoreTests\bin\Release\DesktopAICompanion.CoreTests.exe'
          if ($LASTEXITCODE -ne 0) { throw "Core tests failed (exit $LASTEXITCODE)." }

      - name: Run product self-tests
        # Calls the SAME script tests\run-gate.ps1 calls, rather than carrying its own copy of
        # the flag list. The previous version duplicated that list under a comment reading
        # "Keep in sync with tests\run-gate.ps1" -- an instruction to a human, which drifted:
        # the lists stayed equal while the MARKER MAP and the SKIP DETECTION lived only in the
        # gate. So this step checked exit codes alone, and a self-test whose module folder is
        # absent skips and exits 0. Ten of the eighteen flags passed that way, which is exactly
        # the failure run-gate.ps1's own doc block was written about -- closed locally and left
        # open in the one place that gates every pull request.
        #
        # -OutputRoot is what makes a missing module a failure here too.
        shell: pwsh
        run: |
          $outputRoot = 'build\DesktopAICompanionPortable\bin\Release\x64'
          $exe = Join-Path $outputRoot 'DesktopAICompanion.exe'
          # COLLECT, then throw ONCE at the end -- the shape tests/run-gate.ps1 already uses, whose
          # comment says "one missing module no longer hides every check after it". CI kept the old
          # shape, so a single self-test failure threw here and the 120 source invariants below were
          # never reached: one broken module hid every invariant in the repo, in the one place that
          # gates every pull request.
          $output = @(& .\tests\Invoke-SelfTests.ps1 -ExecutablePath $exe -OutputRoot $outputRoot)
          $output | ForEach-Object { Write-Host $_ }
          $failures = @($output | Where-Object { $_ -like 'SELFTEST-FAILURE:*' })
          # A run that reports zero flags did no work. run-gate.ps1 fails on this; CI ignored the count
          # entirely, so two callers of the same runner disagreed about what an empty run means.
          $countLine = @($output | Where-Object { $_ -like 'SELFTEST-COUNT:*' }) | Select-Object -First 1
          $selfTestCount = if ($countLine) { [int](($countLine -split ':')[1].Trim()) } else { 0 }
          if ($selfTestCount -le 0) {
            $failures += "SELFTEST-FAILURE: the runner reported $selfTestCount flags, so it did no work"
          }
          # Source-text invariant checks (no assembly load; the reflection half is --hardening-selftest).
          # try/catch because it signals by `throw`, same as the gate's own call.
          try { .\tests\runtime-hardening-selftest.ps1 }
          catch { $failures += "SELFTEST-FAILURE: runtime-hardening-selftest.ps1: $($_.Exception.Message)" }
          if ($failures.Count -gt 0) {
            foreach ($failure in $failures) { Write-Host "FAIL: $failure" }
            throw "$($failures.Count) failure(s) across the self-tests and source invariants."
          }

      - name: Convert and verify the shipped companion corpus
        # The local gate runs these and CI did not, so a regression in the shipped Companions
        # corpus or in the Shimeji converter was invisible on every pull request.
        shell: pwsh
        run: |
          dotnet build tools\ShimejiConvert\ShimejiConvert.csproj -c Release --nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'ShimejiConvert build failed.' }
          # No TFM folder: the csproj sets AppendTargetFrameworkToOutputPath=false and
          # OutputPath=bin\Release\. The path here named bin\Release\net10.0-windows\, which has
          # never existed, so this step could only ever fail to find the exe, and it was worse than
          # that: $LASTEXITCODE still held 0 from the dotnet build above, so if pwsh's
          # $ErrorActionPreference were not 'stop' on GitHub's runners, BOTH guards below would pass
          # and the step would exit 0 having verified nothing. run-gate.ps1 has always had the path
          # right, which is why the local gate caught corpus regressions and CI did not.
          # Existence is asserted rather than assumed, so a future output-path change fails loudly.
          $convert = 'tools\ShimejiConvert\bin\Release\ShimejiConvert.exe'
          if (-not (Test-Path -LiteralPath $convert)) { throw "ShimejiConvert.exe missing after build: $convert" }
          & $convert verify Companions
          if ($LASTEXITCODE -ne 0) { throw 'ShimejiConvert verify failed.' }
          & $convert selftest
          if ($LASTEXITCODE -ne 0) { throw 'ShimejiConvert selftest failed.' }

      - name: Check published module payloads are current
        # modules-dist\<id>.zip is a committed artifact the in-app catalog serves, and nothing rebuilds
        # it automatically -- so it rots silently when module source lands without a republish. That is
        # how fortunes.zip shipped with no fortune corpus and aibrain.zip shipped without PR #71's
        # Windows OCR. Needs full history, hence fetch-depth: 0 on the checkout above.
        shell: pwsh
        run: .\packaging\Test-ModulePublishFreshness.ps1

      - name: Check catalog.json still describes the committed content
        # The step above is about module VERSIONS. This one hashes every asset the catalog offers
        # against the COMMITTED blob, which is what raw.githubusercontent.com serves. Without it,
        # a companion or fortune pack edited without regenerating the catalog leaves a recorded
        # sha256 the app rightly refuses, with nothing failing here. Needs full history for
        # `git cat-file`, which the fetch-depth: 0 checkout above already provides.
        shell: pwsh
        run: .\packaging\Test-ContentCatalogIntegrity.ps1

      - name: Check the module template still scaffolds a module that builds
        # Nothing else builds templates\desktop-ai-companion-module, so a rename in the ABI or ModuleKit would leave it
        # broken and nobody would find out until someone tried to start a module. Scaffolds a throwaway
        # module, asserts every placeholder was substituted and that ModuleKit ships beside it while
        # Contracts does not, builds it, then removes it. tests\run-gate.ps1 runs this too.
        shell: pwsh
        run: .\packaging\Test-ModuleTemplate.ps1

      - name: Install WiX and build the MSI
        shell: pwsh
        run: |
          .\packaging\Install-LockedWixToolchain.ps1 `
            -PackageRoot (Join-Path $env:RUNNER_TEMP 'DesktopAICompanion-WiX-5.0.2') `
            -GlobalExtension
          .\installer\build-installer.ps1 -Config Release

      - name: Upload the ZIP and MSI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DesktopAICompanion-x64
          path: |
            dist/DesktopAICompanion-Portable.zip
            dist/DesktopAICompanion.msi
          if-no-files-found: error

  resource-soak:
    name: Leak soak (manual)
    # Opt-in only. The soak drives the real app and asserts that OS handle/GDI/USER/private-byte growth stays
    # bounded, which needs a genuine window station and makes it the flakiest assertion available on a hosted
    # runner -- so it must not gate every PR. The release checklist runs it locally before a tag; this job
    # exists so it is reachable in CI when a maintainer wants it.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up the .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.302'

      - name: Build Release x64
        shell: pwsh
        run: .\build.ps1 -Release

      - name: Run the bounded leak soak
        shell: pwsh
        run: .\tests\runtime-resource-soak.ps1
