name: release

# THE tag-triggered release pipeline. Push a vMAJOR.MINOR.PATCH tag
# (git tag v1.0.1 && git push origin v1.0.1) and this builds the x64 portable ZIP + per-user MSI, packs the
# module-author NuGet packages, writes SHA256SUMS.txt over all of them, and publishes them on the GitHub
# release for that tag.
#
# This used to be one of TWO workflows triggered by `v*`, alongside publish-release.yml. Both published to the
# same release with `gh release upload --clobber`, so they raced: whichever finished last won, and
# SHA256SUMS.txt listed the author packages or not depending on the outcome. That made every release
# non-deterministic. publish-release.yml has been deleted and its two correctness properties -- checking out
# the TAG rather than the default branch, and verifying the tag against ProductVersion.props -- were folded in
# here, which is where the nupkg packing already lived.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v1.0.1)
        required: true
        type: string

permissions:
  contents: write

# One publish per tag at a time. Two concurrent runs would clobber each other's assets, which is the same
# failure the two-workflow collision produced.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the x64 release
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Resolve and validate the tag
        id: tag
        shell: pwsh
        # The three ${{ }} values arrive through env, never interpolated into the script body. A
        # workflow_dispatch input is attacker-influenced text, and pasting it between single quotes
        # lets a tag containing a quote close the literal and run the rest as PowerShell -- in the one
        # job that later holds SIGNING_PFX_BASE64 and SIGNING_PFX_PASSWORD. Only actors with write
        # access can dispatch this, so the exposure was small, but the regex below validates the tag
        # AFTER the interpolation would already have executed, which is the wrong order to rely on.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:REF_NAME }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag must be vMAJOR.MINOR.PATCH; got '$tag'."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
          $assetVersion = $tag.Replace('.', '')
          "portable=DesktopAICompanion-Portable-$assetVersion.zip" >> $env:GITHUB_OUTPUT
          "installer=DesktopAICompanion-$assetVersion.msi" >> $env:GITHUB_OUTPUT

      - name: Check out the tag
        # ref matters: without it a workflow_dispatch re-run builds the DEFAULT BRANCH and then uploads those
        # artifacts under the requested tag's release, publishing something that was never tagged.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Set up the .NET 10 SDK
        # The pin is read from global.json (exact version, rollForward "disable"); see build.yml (F001). The
        # old 10.0.201 literal existed because 10.0.302 misreported the legacy net48 project's framework in
        # `dotnet list package` -- there is no net48 project and no list-package gate any more.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Confirm the tag matches ProductVersion.props
        # A tag that disagrees with the product version ships artifacts whose file versions contradict the
        # release they are attached to -- and after an ABI change, a stale Contracts.dll that no module can
        # resolve. Cheaper to fail here than to unpick a published release.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$props = Get-Content -LiteralPath ProductVersion.props -Raw
          $version = [string]$props.Project.PropertyGroup.DesktopAICompanionVersion
          if ($version -ne '${{ steps.tag.outputs.version }}') {
            throw "Tag ${{ steps.tag.outputs.tag }} does not match DesktopAICompanionVersion '$version'."
          }
          Write-Host "Version $version confirmed for tag ${{ steps.tag.outputs.tag }}."

      # The "Select Visual Studio MSBuild" step was removed 2026-09-17. Its own comment already
      # called it vestigial: build.ps1 stopped probing MSBuild/VS, and the MSI is built by the `wix`
      # dotnet tool, so nothing in this workflow or any script it calls invokes msbuild -- verified
      # by grep across .github/, build.ps1, packaging/, installer/ and tests/. All it did was put a
      # third-party action, pinned by sha, on the release path to set a PATH nobody read.

      # Signing is SCAFFOLDING until a certificate exists. With no SIGNING_PFX_BASE64 secret this imports
      # nothing, leaves the thumbprint output empty, and every build below signs nothing -- a warning, not a
      # failure, because an unsigned release is the currently documented state (PROVENANCE.md) and a missing
      # secret must not break the release path.
      #
      # When a certificate arrives: add SIGNING_PFX_BASE64 and SIGNING_PFX_PASSWORD and this starts signing
      # with no further edits. Do NOT let a v* tag be the first execution of that path -- dry-run it through
      # workflow_dispatch on a throwaway tag first. "No further edits" holds for this file, the release notes
      # included (the publish step reads the thumbprint and says Signed or Unsigned accordingly, RA-002); the
      # two documents that also say "unsigned" are outside it and want a hand edit on the same day:
      # PROVENANCE.md (its first paragraph) and docs/RELEASE-CHECKLIST.md (its first line).
      - name: Import the signing certificate (skipped when no secret is configured)
        id: signing
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            Write-Output '::warning::No signing certificate configured; publishing an UNSIGNED build.'
            'thumbprint=' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $securePassword = ConvertTo-SecureString -String $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          # Delete the file immediately: the certificate now lives in the store for the rest of the job, and
          # the .pfx on disk is the only copy an unrelated step could read.
          Remove-Item -LiteralPath $pfxPath -Force
          "thumbprint=$($imported.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "Imported signing certificate $($imported.Subject)"

      # THROUGH env, the same way the tag step above takes its three values. `vars.SIGN_TIMESTAMP_URL` is
      # free text set in the repository settings, and until 2026-09-30 it was pasted between single quotes
      # into this run body and the MSI step's: GitHub expands `${{ }}` before pwsh parses the text, so a
      # value that closed the literal would have run as PowerShell in the one job whose store holds the
      # imported signing certificate. The thumbprint is hex from Import-PfxCertificate and was never a
      # risk; it moves too so every runner-supplied value reaches a script the same one way. An unset
      # variable arrives as $null and binds to build.ps1's [string] parameter as '', exactly as the old ''
      # did, so the unsigned release path is unchanged. Guarded by a source invariant in
      # tests\runtime-hardening-selftest.ps1 that reads every run body of this file.
      - name: Build Release x64 and the portable ZIP
        shell: pwsh
        env:
          SIGNING_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
          SIGN_TIMESTAMP_URL: ${{ vars.SIGN_TIMESTAMP_URL }}
        run: >-
          .\build.ps1 -Release -Zip
          -SigningCertThumbprint $env:SIGNING_THUMBPRINT
          -SignTimestampUrl $env:SIGN_TIMESTAMP_URL

      - name: Install WiX and build the MSI
        shell: pwsh
        env:
          SIGNING_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
          SIGN_TIMESTAMP_URL: ${{ vars.SIGN_TIMESTAMP_URL }}
        run: |
          .\packaging\Install-LockedWixToolchain.ps1 `
            -PackageRoot (Join-Path $env:RUNNER_TEMP 'DesktopAICompanion-WiX-5.0.2') `
            -GlobalExtension
          .\installer\build-installer.ps1 -Config Release `
            -SigningCertThumbprint $env:SIGNING_THUMBPRINT `
            -SignTimestampUrl $env:SIGN_TIMESTAMP_URL

      # Scrub the key from the runner even if a build step failed. A hosted runner is torn down anyway; a
      # self-hosted one is not, and this is the difference between the two.
      - name: Remove the signing certificate from the runner
        if: always()
        shell: pwsh
        env:
          SIGNING_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        run: |
          $thumbprint = $env:SIGNING_THUMBPRINT
          if ([string]::IsNullOrWhiteSpace($thumbprint)) { exit 0 }
          Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.Thumbprint -eq $thumbprint } |
            ForEach-Object { Remove-Item -LiteralPath $_.PSPath -Force }
          Write-Output 'Signing certificate removed from the runner store.'

      - name: Pack the module-author NuGet packages
        # Attached to the release rather than pushed to nuget.org. That keeps a third-party author unblocked
        # -- point a local package source at the downloaded .nupkg files and the template's --standalone mode
        # restores -- without permanently claiming public package ids, and without committing to publish a new
        # package on every host release even when the contract has not changed. Pushing to nuget.org stays a
        # deliberate manual act: see packaging\New-NuGetPackages.ps1, which prints the command.
        shell: pwsh
        run: .\packaging\New-NuGetPackages.ps1 -OutputDirectory dist\nuget

      - name: Assemble release assets and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location dist
          $files = @('${{ steps.tag.outputs.portable }}', '${{ steps.tag.outputs.installer }}')
          # Keep local build filenames stable; version the downloads before hashing and publishing them.
          Rename-Item -LiteralPath 'DesktopAICompanion-Portable.zip' -NewName $files[0]
          Rename-Item -LiteralPath 'DesktopAICompanion.msi' -NewName $files[1]
          # The author packages are checksummed too -- they are a build input for anyone writing a module,
          # so they deserve the same verifiability as the app downloads.
          $packages = @(Get-ChildItem -LiteralPath 'nuget' -Filter '*.nupkg' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike '*.snupkg' } | ForEach-Object { "nuget/$($_.Name)" })
          if ($packages.Count -lt 2) { throw "Expected 2 author packages in dist\nuget; found $($packages.Count)." }
          # Every name is written as a BARE FILENAME, because that is the only layout the checksums are ever
          # verified against: GitHub release assets are flat, so a downloader has all five files in one
          # directory. Through v1.9.13 the packages were listed as `nuget/<name>` -- the path in the BUILD
          # tree, not the release -- so `sha256sum -c SHA256SUMS.txt` reported two files missing, on the same
          # release whose notes say "verify downloads against SHA256SUMS.txt". The hashes were always right;
          # the instruction was unfollowable. Hash the build path, print the download name.
          $lines = foreach ($file in ($files + $packages)) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing release asset: $file" }
            $name = [System.IO.Path]::GetFileName($file)
            "$((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant())  $name"
          }
          # LF, explicitly. Set-Content on Windows writes CRLF, and GNU coreutils `sha256sum -c` treats the
          # trailing \r as part of the FILENAME -- so every line failed with "No such file or directory" on
          # the same release whose notes say to verify against this file. Same class of bug as the nuget/
          # prefix above: correct hashes, unfollowable instruction. Verified against v1.9.16's published
          # file, where all four hashes were right and all four lines failed to verify.
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD.Path 'SHA256SUMS.txt'),
            (($lines -join "`n") + "`n"),
            (New-Object System.Text.ASCIIEncoding))
          Pop-Location

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # Through env like the build steps (F002). The notes used to hardcode "Unsigned" while the
          # scaffolding above promised the first signed release needs no workflow edit, so that
          # release's notes would have contradicted its own validly signed MSI (RA-002).
          SIGNING_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.tag.outputs.tag }}'
          $signedWord = if ([string]::IsNullOrWhiteSpace($env:SIGNING_THUMBPRINT)) { 'Unsigned' } else { 'Signed' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY `
              --title "Desktop AI Companion $tag" `
              --notes "$signedWord x64 build for $tag. Verify downloads against SHA256SUMS.txt."
          }
          $assets = @(
            'dist/${{ steps.tag.outputs.portable }}',
            'dist/${{ steps.tag.outputs.installer }}',
            'dist/SHA256SUMS.txt'
          ) + @(Get-ChildItem -LiteralPath 'dist/nuget' -Filter '*.nupkg' |
                Where-Object { $_.Name -notlike '*.snupkg' } | ForEach-Object { "dist/nuget/$($_.Name)" })
          gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber @assets

      # Keep the Releases page to the three most recent builds. The git TAGS are retained (no --cleanup-tag),
      # so any pruned release can be rebuilt from its tag via this workflow's workflow_dispatch, and trimming
      # also limits how many redistribution-unresolved binaries (see THIRD_PARTY_NOTICES.md) are downloadable.
      # Best-effort: a prune failure never fails a release that already published.
      - name: Prune old releases (keep the 3 most recent; tags retained)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $keep = 3

          # `gh` is a NATIVE command, and native commands do not raise terminating errors, so the
          # try/catch that used to wrap this could not catch a gh FAILURE -- the only thing it ever
          # caught was ConvertFrom-Json's own parse error, one step further down. A `gh release list`
          # that exited non-zero fell straight through to an empty $releases, deleted nothing, and
          # printed the success line. $LASTEXITCODE is the only thing gh reports to PowerShell.
          $listLines = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,createdAt
          $listExit = $LASTEXITCODE
          $listJson = ($listLines -join [Environment]::NewLine)
          if ($listExit -ne 0 -or [string]::IsNullOrWhiteSpace($listJson)) {
            Write-Host "prune: SKIPPED, 'gh release list' exited $listExit with $($listJson.Length) chars of output."
            exit 0
          }

          $releases = @()
          try { $releases = @($listJson | ConvertFrom-Json) } catch { }
          if ($releases.Count -eq 0) {
            Write-Host "prune: SKIPPED, parsed no release from $($listJson.Length) chars of output."
            exit 0
          }

          $old = @($releases | Sort-Object { [datetime]$_.createdAt } -Descending | Select-Object -Skip $keep)
          $deleted = 0
          $failed = @()
          foreach ($r in $old) {
            gh release delete $r.tagName --repo $env:GITHUB_REPOSITORY --yes
            if ($LASTEXITCODE -eq 0) {
              $deleted++
              Write-Host "prune: deleted $($r.tagName) (git tag kept)"
            } else {
              $failed += $r.tagName
              Write-Host "prune: FAILED to delete $($r.tagName), gh exited $LASTEXITCODE"
            }
          }

          # A summary that VARIES with what happened. What was here printed "Kept the 3 most recent
          # releases." unconditionally -- after a failed list, after zero deletions, and after every
          # single delete failed. It was incapable of reporting a problem, which is the whole reason
          # a silent prune failure could sit in a green run indefinitely.
          $summary = "prune: $($releases.Count) listed, $($old.Count) beyond the $keep kept, $deleted deleted"
          if ($failed.Count) { $summary += ", $($failed.Count) FAILED ($($failed -join ', '))" }
          Write-Host $summary
          # Still best-effort by design: a prune problem must never fail a release that has already
          # published its assets. It is now VISIBLE in the log rather than dressed as success.
          exit 0
